name: Build Alien

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV

          # Install Theos
          git clone --recursive https://github.com/theos/theos.git $THEOS

          # Install iOS SDKs
          mkdir -p $THEOS/sdks
          cd $THEOS/sdks
          curl -L -o sdks.zip https://github.com/theos/sdks/archive/master.zip
          unzip -q sdks.zip
          mv sdks-master/*.sdk .
          rm -rf sdks.zip sdks-master

          # Install ldid (required for signing)
          brew install ldid

          # Install dpkg (required for building .deb)
          brew install dpkg

          # Verify
          echo "SDKs installed:"
          ls $THEOS/sdks

      - name: Build rootless package
        run: |
          make clean package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless \
            ARCHS=arm64

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alien-deb
          path: packages/*.deb
